[package]
name = "stargauge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Track the stars of a GitHub repository: statistics, charts and an offline HTML report"
repository = "https://github.com/GlobalArtInc/stargauge"
readme = "README.md"

[lib]
name = "stargauge"
path = "src/lib.rs"

[[bin]]
name = "stargauge"
path = "src/main.rs"

[dependencies]
ureq = { version = "3.5.0", features = ["json"] }
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
indicatif = "0.18.6"
comfy-table = "8.0.1"
askama = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
chrono = { version = "0.4.45", features = ["serde"] }
iana-time-zone = "0.1.65"
dirs = "7.0.0"
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
ctrlc = "3.5.2"
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
