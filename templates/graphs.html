<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Shotstars-style graphs: {{ repo }}</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .plot-container {
            width: 100%;
            margin-bottom: 30px;
            box-sizing: border-box;
        }
        .chart {
            width: 100%;
            height: 480px;
        }
        #night-mode-message {
            background-color: gray;
            color: black;
            font-size: 14px;
            opacity: 1;
            transition: opacity 4s ease-out;
        }
        footer {
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div>
        <p id="night-mode-message">Night mode is activated from 8 pm to 3 am.</p>
    </div>

    <div class="plot-container"><div id="daily" class="chart"></div></div>
    <div class="plot-container"><div id="cumulative" class="chart"></div></div>
    <div class="plot-container"><div id="year" class="chart"></div></div>
    <div class="plot-container"><div id="month" class="chart"></div></div>
    <div class="plot-container"><div id="weekday" class="chart"></div></div>
    {% if has_hour %}<div class="plot-container"><div id="hour" class="chart"></div></div>{% endif %}

    <footer><p>Generated by stargauge, based on Shotstars by snooppr</p></footer>

    <script type="application/json" id="data">{{ data|safe }}</script>
    <script src="../../../assets/echarts.min.js"></script>
    <script>
        const hour = new Date().getHours();
        const night = hour >= 20 || hour < 3;
        const backgroundColor = night ? '#2B2B2B' : '#e0e0e0';
        const color = night ? 'yellow' : 'black';
        document.body.style.backgroundColor = backgroundColor;
        const data = JSON.parse(document.getElementById('data').textContent);
        const titleStyle = el => ({ width: Math.max(el.clientWidth - 100, 120), overflow: 'break' });
        const charts = [];
        for (const [id, option] of Object.entries(data)) {
            const el = document.getElementById(id);
            const chart = echarts.init(el, night ? 'dark' : null);
            const title = Object.assign({}, option.title, { textStyle: Object.assign({}, option.title.textStyle, titleStyle(el)) });
            chart.setOption(Object.assign({ backgroundColor, textStyle: { color } }, option, { title }));
            charts.push({ el, chart });
        }
        window.addEventListener('resize', () => charts.forEach(({ el, chart }) => {
            chart.setOption({ title: { textStyle: titleStyle(el) } });
            chart.resize();
        }));
        const message = document.getElementById('night-mode-message');
        setTimeout(() => { message.style.opacity = 0; }, 2000);
    </script>
</body>
</html>
